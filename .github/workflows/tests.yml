name: tests

# The suite builds its own synthetic statements, so CI never calls the SEC.
# A model whose tests depend on a live filing feed cannot tell a broken
# formula from a failed download.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pyflakes
      - name: Lint
        run: python -m pyflakes src tests
      - name: Tests
        run: python -m pytest
